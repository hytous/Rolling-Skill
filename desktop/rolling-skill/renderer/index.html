<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Rolling Skill</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="titlebar" aria-hidden="true"></div>
        <main class="shell">
            <header class="masthead">
                <div class="brand-mark"><img src="logo.svg" alt="" /></div>
                <div>
                    <div class="eyebrow">LOCAL SKILL EVALUATION</div>
                    <h1>Rolling Skill</h1>
                </div>
                <div id="phase-pill" class="phase-pill">Starting</div>
            </header>

            <section class="hero panel">
                <div class="status-symbol" id="status-symbol"><span></span></div>
                <div class="hero-copy">
                    <h2 id="status-title">Starting the desktop client</h2>
                    <p id="status-detail">Inspecting the local runtime…</p>
                    <div class="repository" id="repository">Locating the Agenta checkout</div>
                </div>
            </section>

            <div class="content-grid">
                <section class="panel steps-panel">
                    <div class="panel-heading">
                        <h3>Runtime</h3>
                        <span>Managed locally</span>
                    </div>
                    <ol class="steps" id="steps"></ol>
                    <div class="actions">
                        <button id="open-workbench" class="button primary hidden">Open workbench</button>
                        <button id="retry" class="button primary">Retry</button>
                        <button id="login" class="button primary hidden">Open Terminal for login</button>
                        <button id="choose-repository" class="button">Choose checkout…</button>
                        <button id="stop" class="button danger hidden">Stop runtime</button>
                    </div>
                </section>

                <section class="panel logs-panel">
                    <div class="panel-heading">
                        <h3>Live logs</h3>
                        <button id="open-logs" class="text-button">Open full log</button>
                    </div>
                    <pre id="logs" aria-live="polite">Waiting for runtime output…</pre>
                </section>
            </div>

            <footer>
                <span>Closing this window keeps the runtime and evaluation data.</span>
                <button id="reveal-repository" class="text-button">Show checkout in Finder</button>
            </footer>
        </main>
        <script src="renderer.js"></script>
    </body>
</html>
