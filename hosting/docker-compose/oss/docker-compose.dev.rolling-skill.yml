services:
    runner:
        environment:
            # The launcher copies only auth.json into this isolated host directory. The operator's
            # real Codex config, plugins, apps, and skill directories are never mounted.
            CODEX_HOME: /codex-home
            AGENTA_RUNNER_CODEX_EVIDENCE_CAPTURE: "on"
            AGENTA_RUNNER_CODEX_EVIDENCE_ARTIFACT_ROOT: /var/lib/agenta/codex-evidence
        volumes:
            # Read-write is required because Codex refreshes the isolated OAuth copy in place.
            - ${ROLLING_SKILL_CODEX_HOME_DIR:?ROLLING_SKILL_CODEX_HOME_DIR is required}:/codex-home:rw
            # Evidence is durable across runner rebuilds and Compose restarts.
            - ${ROLLING_SKILL_EVIDENCE_DIR:?ROLLING_SKILL_EVIDENCE_DIR is required}:/var/lib/agenta/codex-evidence:rw
